    .copy-btn { background: #333; color: #fff; border: 1px solid #444; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .copy-btn:hover { background: var(--accent); border-color: var(--accent); color: #000; font-weight: bold; }

if (strcmp(dp->d_name, ".") == 0 || strcmp(dp->d_name, "..") == 0) {

}

// Wyciaganie nazwy pakietu i wersji z linii "numpy 1.0.0\\n":
char pkg[128], ver[128];
if (sscanf(line, "%127s %127s", pkg, ver) == 2) {
    // Poprawnie wczytano oba slowa
}`

  // =========================================================================

  {
    id: "dir-functions",
    cat: "4. Katalogi i stat",
    title: "Obsługa katalogów (opendir, readdir, closedir)",
    tags: "dir dirent opendir readdir closedir d_name d_ino errno",
    code: `/* =========================================================================
 * 1. DIR *opendir(const char *name)
 *    - Co robi: Otwiera strumien katalogu wskazany sciezka 'name' i ustawia go na 1. wpisie.
 *    - Argumenty: name - sciezka do katalogu (np. ".", "/var", "library").
 *    - Zwraca: Wskaznik typu DIR* (uchwyt strumienia katalogu).
 *    - Blad: Zwraca NULL i ustawia errno (np. ENOENT - brak katalogu, EACCES - brak praw, ENOTDIR).
 *
 * 2. struct dirent *readdir(DIR *dirp)
 *    - Co robi: Zwraca wskaznik na strukture opisujaca kolejny wpis w katalogu i przesuwa kursor.
 *    - Argumenty: dirp - otwarty strumien z opendir().
 *    - Pola struct dirent (wg POSIX):
 *        char d_name[]  -> nazwa pliku/katalogu (SAMA NAZWA, bez sciezki!)
 *        ino_t d_ino    -> numer i-wezla (inode) pliku
 *    - Zwraca: Wskaznik struct dirent* lub NULL.
 *    - Blad vs Koniec katalogu: Zwraca NULL zarowno na koncu katalogu, jak i przy bledzie!
 *      DLATEGO: Przed kazdym wywolaniem ustaw errno = 0. Jesli zwroci NULL i errno != 0 -> BLAD!
 *
 * 3. int closedir(DIR *dirp)
 *    - Co robi: Zamyka strumien katalogu i zwalnia powiazana pamiec oraz deskryptor.
 *    - Argumenty: dirp - uchwyt z opendir().
 *    - Zwraca: 0 w przypadku sukcesu.
 *    - Blad: Zwraca -1 i ustawia errno (np. EBADF).
 * ========================================================================= */

DIR *dirp = opendir(path);
if (dirp == NULL) ERR("opendir");

struct dirent *dp;
while (1) {
    errno = 0; // OBOWIĄZKOWE przed każdym readdir!
    dp = readdir(dirp);
    if (dp == NULL) {
        if (errno != 0) ERR("readdir");
        break; // Normalny koniec katalogu
    }
    if (strcmp(dp->d_name, ".") == 0 || strcmp(dp->d_name, "..") == 0)
        continue; // Pomijamy kropki!

    printf("Znaleziono wpis: %s\\n", dp->d_name);
}

if (closedir(dirp) == -1) ERR("closedir");`
  },
  {
    id: "stat-lstat-info",
    cat: "4. Katalogi i stat",
    title: "Metadane plików (stat, lstat, struct stat, makra S_IS*)",
    tags: "stat lstat fstat struct st_mode st_size s_isdir s_isreg s_islnk",
    code: `/* =========================================================================
 * 1. int stat(const char *restrict path, struct stat *restrict buf)
 *    - Co robi: Pobiera metadane pliku wskazanego przez 'path' i zapisuje je do '*buf'.
 *      PODĄŻA za dowiązaniami symbolicznymi (bada plik docelowy, na który wskazuje link!).
 *
 * 2. int lstat(const char *restrict path, struct stat *restrict buf)
 *    - Co robi: Identycznie jak stat(), ale NIE PODĄŻA za symlinkami – jeśli 'path' to
 *      symlink, zwraca informacje o samym linku (typ S_ISLNK, rozmiar samej ścieżki).
 *      NA LABACH ZAWSZE DOMYŚLNIE UŻYWAJ lstat()!
 *
 * Argumenty obu funkcji:
 *    - path: ścieżka do badanego pliku (UWAGA: jeśli nie zrobiłeś chdir() do przeglądanego
 *            katalogu, musisz skleić ścieżkę "katalog/d_name", bo samo dp->d_name nie zadziała!).
 *    - buf:  wskaźnik na zaalokowaną strukturę 'struct stat' (np. &filestat).
 * Zwraca: 0 w razie sukcesu.
 * Błąd:   Zwraca -1 i ustawia errno (ENOENT, EACCES, ENOTDIR, ELOOP).
 *
 * Najważniejsze pola 'struct stat':
 *    - mode_t  st_mode   -> typ pliku oraz bity uprawnień (rwx)
 *    - off_t   st_size   -> rozmiar pliku w bajtach (rzutuj na (long) przy printf "%ld")
 *    - ino_t   st_ino    -> numer inode
 *    - nlink_t st_nlink  -> liczba twardych dowiązań (hardlinks)
 *    - uid_t   st_uid    -> ID właściciela
 *    - gid_t   st_gid    -> ID grupy
 *
 * Makra sprawdzające typ pliku (przyjmują pole filestat.st_mode):
 *    - S_ISREG(st.st_mode)  -> niezerowe (true), jeśli to zwykły plik (regular file)
 *    - S_ISDIR(st.st_mode)  -> niezerowe (true), jeśli to katalog (directory)
 *    - S_ISLNK(st.st_mode)  -> niezerowe (true), jeśli to link symboliczny (tylko po lstat!)
 *    - S_ISFIFO(st.st_mode) -> kolejka FIFO / potok nazwany
 * ========================================================================= */

struct stat st;
if (lstat(full_path, &st) == -1) {
    ERR("lstat");
}

if (S_ISDIR(st.st_mode)) {
    printf("Katalog: %s\\n", full_path);
} else if (S_ISREG(st.st_mode)) {
    printf("Zwykly plik: %s, rozmiar: %ld B\\n", full_path, (long)st.st_size);
} else if (S_ISLNK(st.st_mode)) {
    printf("Symlink: %s\\n", full_path);
}`
  },

  // =========================================================================
  // 5. NAWIGACJA KATALOGIEM ROBOCZYM (getcwd, chdir)
  // =========================================================================
  {
    id: "getcwd-chdir",
    cat: "5. getcwd i chdir",
    title: "Zmiana i odczyt katalogu roboczego (getcwd, chdir)",
    tags: "getcwd chdir cwd pwd homedir nawigacja sciezki",
    code: `/* =========================================================================
 * 1. char *getcwd(char *buf, size_t size)
 *    - Co robi: Zapisuje bezwzględną ścieżkę aktualnego katalogu roboczego (CWD)
 *      procesu do tablicy 'buf'.
 *    - Argumenty:
 *        buf  -> zaalokowana tablica znaków (np. char homedir[MAX_PATH])
 *        size -> rozmiar bufora w bajtach (np. sizeof(homedir))
 *    - Zwraca: Wskaźnik 'buf' w razie sukcesu.
 *    - Błąd:   Zwraca NULL i ustawia errno (np. ERANGE gdy bufor jest za mały!).
 *
 * 2. int chdir(const char *path)
 *    - Co robi: Zmienia bieżący katalog roboczy (CWD, czyli ".") procesu na 'path'.
 *    - Argumenty: path -> ścieżka względna (np. "podfolder", "..") lub bezwzględna ("/var").
 *    - Zwraca: 0 w razie sukcesu.
 *    - Błąd:   Zwraca -1 i ustawia errno (ENOENT - nie istnieje, EACCES - brak praw X_OK, ENOTDIR).
 *
 * DLACZEGO ZAPAMIĘTUJEMY homedir PRZEZ getcwd()?
 * Gdy w pętli robisz chdir(folders[i]) dla ścieżek względnych (np. "-p dir1 -p dir2"),
 * po wejściu do "dir1" proces fizycznie tam zostaje. Bez powrotu przez chdir(homedir)
 * w kolejnym obrocie pętli szukałby "dir2" WEWNĄTRZ "dir1" (czyli "dir1/dir2")!
 * ========================================================================= */

char homedir[256];
if (getcwd(homedir, sizeof(homedir)) == NULL) ERR("getcwd");

for (int i = 0; i < folder_count; i++) {
    if (chdir(folders[i]) == -1) {
        perror("chdir"); // Wypisze blad na stderr, ale nie ubije programu
        continue;

    code: `/* =========================================================================
 * 1. int getopt(int argc, char * const argv[], const char *optstring)
 *    - Co robi: Parsuje flagi wiersza poleceń zaczynające się od '-'.
 *    - Argumenty:
 *        argc, argv -> parametry z main(int argc, char **argv)
 *        optstring  -> string definiujący dozwolone flagi, np. "cv:i:p:d:":
 *          - sama litera (np. 'c')       : flaga bez argumentu (przełącznik, np. -c)
 *          - litera z dwukropkiem ('v:') : flaga WYMAGAJĄCA argumentu (np. -v env_name).
 *                                          Wartość tego argumentu ląduje w globalnym 'char *optarg'.
 *    - Zmienne globalne (<unistd.h>):
 *        char *optarg -> wskaźnik na argument bieżącej opcji (dla flag z ':')
 *        int optind   -> indeks w argv[] pierwszego argumentu POZA flagami (pozycyjnego).
 *                        Jeśli po zakończeniu pętli (optind < argc), użytkownik podał
 *                        dodatkowe parametry pozycyjne!
 *    - Zwraca: Znak rozpoznanej opcji (np. 'c', 'v'), '?' w razie nieznanej opcji / braku
 *              wymaganego argumentu, lub -1 gdy wszystkie opcje zostały przetworzone.
 *
 * 2. long strtol(const char *restrict nptr, char **restrict endptr, int base)
 *    - Co robi: Konwertuje string 'nptr' na liczbę całkowitą typu long w systemie o podstawie 'base'.
 *    - Argumenty:
 *        nptr   -> tekst do konwersji (np. optarg)
 *        endptr -> adres wskaźnika (np. &endptr lub NULL). Po wykonaniu wskazuje na pierwszy
 *                  znak, którego nie udało się skonwertować (jeśli *endptr != '\\0', w napisie były śmieci!).
 *        base   -> system liczbowy: 10 (dziesiętny, np. rozmiar/głębokość) lub 8 (oktalny, np. uprawnienia -p 0755).
 *    - Zwraca: Skonwertowana wartość long. Przy przepełnieniu ustawia errno = ERANGE.
 * ========================================================================= */

int c;
int c_flag = 0;
char *out_file = NULL; // Pozwala wykryć nadmiarowe podanie flagi -o!
char *paths[10];
int path_count = 0;
long size = -1;
mode_t perms = (mode_t)-1;

while ((c = getopt(argc, argv, "co:p:s:m:")) != -1) {
    switch (c) {
        case 'c':
            c_flag = 1;
            break;
        case 'o':
            if (out_file != NULL) usage(argv[0]); // Błąd: nadmiarowe -o!
            out_file = optarg;
            break;
        case 'p':
            if (path_count >= 10) usage(argv[0]);
            paths[path_count++] = optarg;
            break;
        case 's': {
            char *endptr;
            errno = 0;
            size = strtol(optarg, &endptr, 10); // Baza 10
            if (errno != 0 || *endptr != '\\0' || size < 0) usage(argv[0]);
            break;
        }
        case 'm':
            perms = (mode_t)strtol(optarg, NULL, 8); // Baza 8 (oktalna dla uprawnień)
            break;
        case '?':
        default:
            usage(argv[0]);
    }
}

// Sprawdzenie, czy podano niedozwolone dodatkowe parametry pozycyjne:
if (optind < argc) {
    usage(argv[0]);
}`

int has_extension(const char *filename, const char *ext) {
    if (ext == NULL) return 1; // Brak filtra (-e nie podano) -> akceptuj każdy plik

    if (dot == NULL || dot == filename) return 0; // Brak kropki lub plik ukryty (np. ".bashrc")

    code: `typedef struct {
    char **dirs;      // Dynamiczna tablica wskaźników (zawsze wystarczy rozmiar argc!)
    int dir_count;
    char *extension;  // NULL oznacza brak filtra
    int max_depth;    // np. INT_MAX z <limits.h> domyślnie
    char *outfile;    // NULL oznacza stdout
} Options;

void parse_args(int argc, char **argv, Options *opts) {
    opts->dirs = malloc(argc * sizeof(char *));
    if (opts->dirs == NULL) ERR("malloc");
    opts->dir_count = 0;
    opts->extension = NULL;
    opts->max_depth = INT_MAX; // Wymaga #include <limits.h>
    opts->outfile = NULL;

    int c;
    while ((c = getopt(argc, argv, "p:e:d:o:")) != -1) {
        switch (c) {
            case 'p':
                opts->dirs[opts->dir_count++] = optarg;
                break;
            case 'e':
                if (opts->extension != NULL) usage(argv[0]);
                opts->extension = optarg;
                break;
            case 'd': {
                char *endptr;
                errno = 0;
                long val = strtol(optarg, &endptr, 10);
                if (errno != 0 || *endptr != '\\0' || val < 1) usage(argv[0]);
                opts->max_depth = (int)val;
                break;
            }
            case 'o':
                if (opts->outfile != NULL) usage(argv[0]); // Max jedno -o
                opts->outfile = optarg;
                break;
            case '?':
            default:
                free(opts->dirs);
                usage(argv[0]);
        }
    }

    if (optind < argc) { // Niedozwolone argumenty pozycyjne
        free(opts->dirs);
        usage(argv[0]);
    }

    // Jeśli nie podano żadnego -p, domyślnie skanuj katalog bieżący "."
    if (opts->dir_count == 0) {
        opts->dirs[opts->dir_count++] = ".";
    }
}
// PAMIĘTAJ: Na końcu main() wywołaj: free(opts.dirs);`

 *    - Co robi: Automatycznie przechodzi całe drzewo katalogów zaczynając od 'dirpath'

 *    - Argumenty:
 *        dirpath -> ścieżka początkowa
 *        fn      -> wskaźnik na Twoją funkcję callback
 *        nopenfd -> max liczba jednocześnie otwartych deskryptorów (np. 20)
 *        flags   -> flagi sterujące (łączone '|'):
 *          FTW_PHYS  : NIE podążaj za symlinkami (odpowiednik lstat - ZAWSZE UŻYWAJ!)

 *          FTW_MOUNT : nie wychodź poza ten sam system plików
 *    - Argumenty funkcji callback 'fn':
 *        fpath    -> pełna ścieżka do aktualnego pliku/katalogu (od dirpath)
 *        sb       -> wskaźnik na gotową strukturę 'struct stat' dla tego obiektu
 *        typeflag -> typ obiektu:
 *          FTW_F   : zwykły plik
 *          FTW_D   : katalog
 *          FTW_DNR : katalog, którego nie da się odczytać
 *          FTW_SL  : link symboliczny (gdy użyto FTW_PHYS)
 *        ftwbuf   -> struktura zawierająca:
 *          ftwbuf->level : głębokość zagnieżdżenia (0 dla samego dirpath, 1 dla jego elementów itd.)
 *          ftwbuf->base  : indeks w 'fpath', od którego zaczyna się sama nazwa pliku
 *                          (czyli nazwa pliku to: fpath + ftwbuf->base)
 *    - Zwraca (callback fn): Zwrócenie 0 kontynuuje przeglądanie; zwrócenie != 0 natychmiast przerywa nftw!
 *    - Zwraca (nftw): 0 w razie sukcesu, -1 w razie błędu systemowego.
 * ========================================================================= */

#define MAXFD 20
static int max_depth_global = 3; // nftw nie przyjmuje void* arg, więc filtry przekazujemy przez zmienne globalne

int walk_callback(const char *fpath, const struct stat *sb, int typeflag, struct FTW *ftwbuf) {
    // ftwbuf->level == 0 to sam katalog główny, level == 1 to pliki bezpośrednio w nim
    if (ftwbuf->level > max_depth_global) {
        return 0; // Ignorujemy głębsze poziomy, ale zwracamy 0, by kontynuować resztę drzewa
    }

    const char *filename = fpath + ftwbuf->base; // Sama nazwa pliku bez ścieżki!

    switch (typeflag) {
        case FTW_D:
            printf("[DIR  lvl=%d] %s\\n", ftwbuf->level, fpath);
            break;
        case FTW_F:
            printf("[FILE lvl=%d] %s (rozmiar: %ld B)\\n", ftwbuf->level, filename, (long)sb->st_size);
            break;
        case FTW_SL:
            printf("[LINK lvl=%d] %s\\n", ftwbuf->level, filename);
            break;
    }
    return 0; // 0 = idź dalej
}

// Wywołanie w main():

 * METODA 2: char *strtok_r(char *str, const char *delim, char **saveptr)

    char *token = strtok_r(line, ";", &saveptr);

        token = strtok_r(NULL, ";", &saveptr);
    }

size_t cap = 0;
ssize_t n;
while ((n = getdelim(&buf, &cap, ';', file)) != -1) {
    if (n > 0 && buf[n - 1] == ';') buf[n - 1] = '\\0';
    printf("Pole: %s\\n", buf);
}
free(buf);`

 * Wymagane nagłówki i makra:
 *   #define _XOPEN_SOURCE 700 (lub _GNU_SOURCE) -> dla setenv / unsetenv / putenv
 *   #include <stdlib.h>
 *
 * WAŻNA ZASADA PROCESOWA:
 *   Każdy proces otrzymuje KOPIĘ zmiennych środowiskowych swojego rodzica (np. powłoki bash).
 *   Zmiany dokonane w programie C (przez setenv / unsetenv) dotyczą TYLKO bieżącego procesu
 *   oraz jego przyszłych procesów potomnych (po fork/exec). NIGDY nie zmieniają zmiennych
 *   w terminalu (powłoce), z którego program został uruchomiony!
 *
 * 1. char *getenv(const char *name)
 *    - Co robi: Szuka zmiennej środowiskowej o nazwie 'name' i zwraca wskaźnik do jej wartości.
 *    - Argumenty: name -> nazwa zmiennej BEZ znaku '$' i BEZ '=' (np. "PATH", "HOME", "L1_OUTPUTFILE").
 *    - Zwraca: Wskaźnik na string z wartością zmiennej.
 *              UWAGA KRYTYCZNA: Ten wskaźnik wskazuje bezpośrednio na pamięć systemową środowiska!
 *              NIE WOLNO go modyfikować (np. przez strtok/strcat) ani zwalniać przez free()!
 *              Jeśli musisz ciąć wartość (np. strtok po ':'), najpierw zrób kopię: strdup(val)!
 *    - Błąd / Brak zmiennej: Zwraca NULL (nie ustawia errno).
 *
 * 2. int setenv(const char *name, const char *value, int overwrite)
 *    - Co robi: Dodaje nową zmienną 'name' o wartości 'value' lub zmienia istniejącą.
 *      Funkcja sama alokuje pamięć i kopiuje oba stringi (możesz podać lokalne bufory ze stosu).
 *    - Argumenty:
 *        name      -> nazwa zmiennej (nie może zawierać znaku '=')
 *        value     -> nowa wartość tekstowa
 *        overwrite -> flaga nadpisywania:
 *          != 0 (np. 1) : jeśli zmienna już istnieje, NADPISZ jej wartość nową
 *          == 0         : jeśli zmienna już istnieje, NIE ZMIENIAJ jej (zwróć 0 i zachowaj starą)
 *    - Zwraca: 0 w razie sukcesu.
 *    - Błąd:   Zwraca -1 i ustawia errno (EINVAL gdy nazwa ma '=' lub jest pusta, ENOMEM).
 *
 * 3. int unsetenv(const char *name)
 *    - Co robi: Usuwa zmienną 'name' ze środowiska procesu. Jeśli zmiennej nie było,
 *      funkcja nic nie robi i kończy się sukcesem!
 *    - Argumenty: name -> nazwa zmiennej do usunięcia.
 *    - Zwraca: 0 w razie sukcesu; -1 w razie błędu (ustawia errno = EINVAL).
 *
 * 4. int putenv(char *string)
 *    - Co robi: Dodaje/zmienia zmienną podaną jako jeden połączony string "NAZWA=WARTOSC".
 *    - PUŁAPKA: W przeciwieństwie do setenv(), putenv() NIE KOPIUJE stringa, tylko wpina
 *      twój wskaźnik bezpośrednio do tablicy środowiska! Dlatego NIE WOLNO podawać do putenv()
 *      lokalnej tablicy ze stosu (char buf[]), która zniknie po wyjściu z funkcji!

 *    - Zwraca: 0 w razie sukcesu; wartość != 0 w razie błędu.
 * ========================================================================= */

// 1. Odczyt zmiennej z wartością domyślną (gdy zmienna nie jest ustawiona):

char *depth_env = getenv("SOP_DEPTH");
if (depth_env != NULL) {
    char *endptr;
    errno = 0;
    long val = strtol(depth_env, &endptr, 10);
    if (errno == 0 && *endptr == '\\0' && val > 0) {
        max_depth = (int)val;

}

// 3. Ustawienie i usunięcie zmiennej w procesie:
if (setenv("MOJA_ZMIENNA", "wartosc_123", 1) == -1) ERR("setenv");

if (unsetenv("MOJA_ZMIENNA") == -1) ERR("unsetenv");`

 *      "NAZWA=WARTOSC", zakończona wskaźnikiem NULL (identycznie jak argv).
 *    - Jak uzyskać dostęp: Zadeklaruj 'extern char **environ;' nad funkcją (lub użyj <unistd.h>).

 * 2. JAK USTAWIAĆ ZMIENNE W TERMINALU (DO TESTOWANIA PROGRAMU NA LABACH):
 *    Sposób A (Tylko dla jednego uruchomienia programu - najczęstszy na testach SOP!):

 *
 *    Sposób B (Na stałe w bieżącym oknie terminala przez export):
 *      $ export L1_OUTPUTFILE="wynik.txt"
 *      $ ./moj_program -o -p .
 *      $ unset L1_OUTPUTFILE   # usunięcie zmiennej z terminala
 *
 *    Sposób C (W CLionie):

 * ========================================================================= */

extern char **environ;

// WZORZEC 1: Wypisanie wszystkich zmiennych środowiskowych procesu (odpowiednik komendy 'env')
void print_all_env(void) {
    for (char **env = environ; *env != NULL; env++) {
        printf("%s\\n", *env); // Wypisze np. "HOME=/home/jakub"
    }
}

// WZORZEC 2: Bezpieczne cięcie zmiennej zawierającej listę ścieżek (np. PATH="/bin:/usr/bin:/local/bin")
// PAMIĘTAJ: Nie wolno robić strtok bezpośrednio na wyniku getenv()! Najpierw robimy strdup()!
void parse_colon_env(const char *var_name) {
    char *raw = getenv(var_name);
    if (raw == NULL) return;

    char *copy = strdup(raw); // Kopia do modyfikowalnej pamięci na stercie
    if (copy == NULL) ERR("strdup");

    char *saveptr;
    char *dir = strtok_r(copy, ":", &saveptr);
    while (dir != NULL) {
        printf("Katalog ze zmiennej %s: %s\\n", var_name, dir);
        dir = strtok_r(NULL, ":", &saveptr);
    }

    free(copy); // Zwalniamy kopię!
}`

    let currentCategory = 'ALL';

    function init() {
      const container = document.getElementById('snippets-container');
      const jumpList = document.getElementById('jump-list');
      const catList = document.getElementById('cat-list');
      const categories = ['ALL', ...new Set(SNIPPETS.map(s => s.cat))];

      // Renderowanie kategorii
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'nav-btn' + (cat === 'ALL' ? ' active' : '');
        btn.textContent = cat === 'ALL' ? 'Wszystkie klocki' : cat;
        btn.onclick = () => {
          currentCategory = cat;
          document.querySelectorAll('#cat-list .nav-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyFilters();
        };
        catList.appendChild(btn);
      });

      // Renderowanie kart i szybkich skoków
      SNIPPETS.forEach((s, idx) => {
        const numTitle = `${idx + 1}. ${s.title}`;

        // Karta
        const card = document.createElement('div');
        card.className = 'snippet';
        card.id = `snip-${s.id}`;
        card.dataset.cat = s.cat;
        card.dataset.search = `${s.title} ${s.tags} ${s.cat} ${s.code}`.toLowerCase();

        const header = document.createElement('div');
        header.className = 'snippet-header';
        header.innerHTML = `<div><span class="snippet-title">${numTitle}</span><span class="snippet-cat">[${s.cat}]</span></div>`;

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = 'Kopiuj';
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(s.code).then(() => {
            copyBtn.textContent = 'Skopiowano!';
            setTimeout(() => copyBtn.textContent = 'Kopiuj', 1000);
          });
        };
        header.appendChild(copyBtn);

        const pre = document.createElement('pre');
        const codeEl = document.createElement('code');
        codeEl.textContent = s.code; // Bezpiecznie escapuje < > &
        pre.appendChild(codeEl);

        card.appendChild(header);
        card.appendChild(pre);
        container.appendChild(card);

        // Link w menu bocznym
        const link = document.createElement('a');
        link.href = `#snip-${s.id}`;
        link.className = 'nav-btn';
        link.dataset.cat = s.cat;
        link.textContent = numTitle;
        jumpList.appendChild(link);
      });
    }

    function applyFilters() {
      const q = document.getElementById('search').value.toLowerCase();
      document.querySelectorAll('.snippet').forEach(el => {
        const matchCat = (currentCategory === 'ALL' || el.dataset.cat === currentCategory);
        const matchSearch = el.dataset.search.includes(q);
        el.classList.toggle('hidden', !(matchCat && matchSearch));
      });
    }

    document.getElementById('search').addEventListener('input', applyFilters);
    init();
